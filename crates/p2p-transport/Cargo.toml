[package]
name = "p2p-transport"
description = "Tor process control, onion services and the authenticated peer channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
sha2 = "0.11.1"
sha3 = "0.12.0"
snow = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs"] }
tokio-socks = "0.5.3"
tracing = "0.1.44"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
