[package]
name = "p2p-core"
description = "Application core: contacts, pairing, messaging, outbox, peer protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
p2p-proto = { path = "../p2p-proto" }
sha2 = "0.10.9"
p2p-signal = { path = "../p2p-signal" }
p2p-transport = { path = "../p2p-transport" }
p2p-vault = { path = "../p2p-vault" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-socks = "0.5.3"
tracing = "0.1.44"
zeroize = "1.9.1"

[features]
insecure-test-params = ["p2p-vault/insecure-test-params"]

[dev-dependencies]
p2p-vault = { path = "../p2p-vault", features = ["insecure-test-params"] }
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
