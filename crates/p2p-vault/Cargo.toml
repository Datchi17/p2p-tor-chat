[package]
name = "p2p-vault"
description = "Passphrase-protected encrypted storage (Argon2id + SQLCipher)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Lets other crates' tests open vaults created with tiny KDF parameters. Never enable in release.
insecure-test-params = []
