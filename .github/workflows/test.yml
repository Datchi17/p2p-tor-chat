name: test

# Runs on every push and pull request so changes show ✅/❌ before anyone merges them.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: protoc (pinned, checksum-verified)
        run: |
          curl -sSfLO https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          echo "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278  protoc-36.2-linux-x86_64.zip" | sha256sum -c -
          unzip -q protoc-36.2-linux-x86_64.zip -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: "1.99.1"
          components: clippy
      - name: Unit and robustness tests
        run: cargo test --workspace --exclude p2p-chat --locked
      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --exclude p2p-chat --all-targets --locked -- -D warnings
